name: Aveniq validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: node --check aveniq/app/static/assets/app.js
      - name: Python syntax
        run: python -m py_compile aveniq/app/server.py
      - name: Server configuration tests
        run: python -m unittest discover -s tests -p 'test_config.py' -v
      - name: Frontend interaction smoke tests
        run: node --test tests/test_ui.cjs
      - name: App manifest
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          c=yaml.safe_load(open('aveniq/config.yaml'))
          assert c['ingress'] is True
          assert c['ingress_port']==8099
          assert c['homeassistant_api'] is True
          assert c['version']
          print('Aveniq App manifest valid:',c['version'])
          PY
